<style>
/* VOICE: une appli de banque perso, claire et rassurante ; on voit l'essentiel en une seconde
   IDEA: l'écran d'accueil d'une banque mobile : une carte par compte, puis le détail d'un compte
   PICTURE: grand solde centré sur bandeau aubergine, fin de mois juste dessous ; camembert par famille
   COLOUR and TYPE: aubergine #2b1f3a, lilas, corail en accent ; une couleur par famille de dépenses ; Outfit
   LAYOUT: colonne d'appli centrée ; accueil = liste de comptes + ajouter ; compte = solde, à venir, onglets */
:root{color-scheme:light dark;--bg:light-dark(#f3f6f8,#0b1720);--card:light-dark(#fff,#12222e);--ink:light-dark(#0f2230,#e8f1f6);--mut:light-dark(#5d7180,#93aab8);--line:light-dark(#e3eaef,#21384a);--soft:light-dark(#eaf0f4,#1a2e3b);--plum:#0f2a3d;--lil:#9fd8e8;--cor:#ff7a59;--neg:light-dark(#e0364c,#ff8095);--pos:light-dark(#0f9a6c,#5eead4)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Outfit,system-ui,sans-serif;overflow-x:clip}
.app{max-width:760px;margin:0 auto;padding:0 max(4vw,14px) 60px}
button,input,select{font:inherit;font-size:16px;color:inherit}
button{min-height:44px;padding:0 18px;border:0;border-radius:999px;background:var(--soft);cursor:pointer;font-weight:500}
button:hover{filter:brightness(.97)}button.pri{background:linear-gradient(135deg,#ff9a6b,#ff5f6d);color:#fff;font-weight:600;box-shadow:0 8px 20px -8px rgba(255,95,109,.6)}
button.x{background:none;color:var(--mut);padding:0;min-width:40px}
:focus-visible{outline:3px solid var(--cor);outline-offset:2px}
input,select{min-height:48px;padding:0 14px;border:1.5px solid var(--line);background:var(--card);border-radius:14px;width:100%}
input:focus,select:focus{border-color:var(--lil);outline:none}
.mut{color:var(--mut);font-size:14px}.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.neg{color:var(--neg)}.pos{color:var(--pos)}
.head{background:radial-gradient(520px 320px at 92% -20%,rgba(255,122,89,.45),transparent 65%),radial-gradient(560px 340px at -5% 115%,rgba(20,184,166,.45),transparent 65%),linear-gradient(160deg,#123a52,#0b2233);color:#f2f8fb;padding:18px 0 84px}
.bar1{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:760px;margin:0 auto;padding:0 max(4vw,14px)}
.bar1 h1{font-size:19px;margin:0;font-weight:600;text-align:center;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb{background:rgba(255,255,255,.12);color:#fff;min-width:44px;padding:0 14px}
.plus{width:48px;height:48px;min-height:48px;padding:0;font-size:28px;line-height:1;background:linear-gradient(135deg,#ff9a6b,#ff5f6d);color:#fff;font-weight:500;box-shadow:0 8px 20px -6px rgba(255,95,109,.7)}
.center{text-align:center;margin-top:22px;padding:0 14px}
.center small{color:var(--lil);font-size:16px}
.big{font-size:clamp(46px,11vw,80px);font-weight:700;letter-spacing:-.03em;line-height:1.05;white-space:nowrap}
.big.n{color:#ffa08a}
.fin{margin-top:10px;font-size:15px;color:#b9d3df}.fin b{display:block;font-size:clamp(26px,6vw,34px);color:#7ef0d6;font-weight:700;line-height:1.15}.fin b.n{color:#ffa08a}
.fin span{font-size:13px}
.card{background:var(--card);border-radius:24px;padding:clamp(16px,3vw,24px);box-shadow:0 1px 2px rgba(15,42,61,.06),0 10px 30px -12px rgba(15,42,61,.18);margin-bottom:16px}
.up{margin-top:-62px;position:relative}
h2{font-size:20px;margin:0 0 10px;font-weight:600}
/* accueil */
.acc{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border-radius:22px;padding:16px 18px;min-height:84px;box-shadow:0 1px 2px rgba(15,42,61,.06),0 8px 24px -14px rgba(15,42,61,.25);margin-bottom:12px}
.acc:hover{filter:none;transform:translateY(-1px)}.acc .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none}
.acc .t{flex:1}.acc .t b{display:block;font-size:17px;font-weight:600}.acc .v{text-align:right}.acc .v b{font-size:20px;font-weight:700;display:block}
.addacc{width:100%;min-height:64px;border:2px dashed #7cc3d6;background:none;border-radius:22px;font-weight:600;color:var(--ink)}
.minibar{height:6px;border-radius:9px;background:var(--soft);margin-top:6px;overflow:hidden}.minibar i{display:block;height:100%;background:var(--pos);border-radius:9px}
/* compte */
.tabs{display:flex;background:var(--soft);border-radius:999px;padding:4px;gap:2px;margin-bottom:16px}.tabs button{flex:1;background:none;min-height:40px;padding:0 8px}
.tabs button[aria-pressed=true]{background:var(--card);box-shadow:0 1px 4px rgba(15,42,61,.15);font-weight:600}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);width:100%;text-align:left;background:none;border-radius:0;min-height:52px}
.row:last-child{border-bottom:0}.row>div{flex:1}.row:hover{filter:none;background:none}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.tag{font-size:12px;padding:1px 8px;border-radius:99px;background:var(--soft);color:var(--mut);margin-left:6px;white-space:nowrap}
.pie{width:min(230px,70%);aspect-ratio:1;display:block;margin:4px auto 10px}.pie text{font-family:Outfit,system-ui,sans-serif}
.pie [data-g]{cursor:pointer}.pie.f [data-g]:not(.on){opacity:.3}
.grp{border-bottom:1px solid var(--line)}.grp:last-child{border:0}
.grp>button{display:grid;grid-template-columns:12px minmax(0,1fr) auto 3em 18px;gap:10px;align-items:center;width:100%;background:none;border-radius:0;padding:10px 0;text-align:left;min-height:50px}
.grp>button i{width:12px;height:12px;border-radius:4px}.grp .chev{transition:transform .2s;color:var(--mut)}.grp.open .chev{transform:rotate(90deg)}
.sub{padding:0 0 10px 22px;display:none}.grp.open .sub{display:block}
.sub .l{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:15px}
.bar{height:10px;background:var(--soft);border-radius:999px;overflow:hidden;margin:6px 0 4px}.bar i{display:block;height:100%;border-radius:999px}
.mnav{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:6px}.mnav b{min-width:9em;text-align:center;text-transform:capitalize;font-weight:600}.mnav button{min-width:40px;padding:0;background:var(--soft)}
.empty{text-align:center;color:var(--mut);padding:20px 10px}
/* menu + */
#menu{position:fixed;inset:0;z-index:20;display:none}#menu.on{display:block}
#menu .pop{position:absolute;right:max(4vw,14px);top:70px;background:var(--card);border-radius:20px;padding:8px;min-width:250px;box-shadow:0 20px 50px -10px rgba(0,0,0,.4)}
#menu .pop button{display:flex;align-items:center;gap:12px;width:100%;background:none;border-radius:14px;text-align:left;min-height:52px;font-weight:500}
#menu .pop button:hover{background:var(--soft)}#menu .pop i{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-style:normal;font-weight:700;color:#fff;flex:none}
@media(min-width:800px){#menu .pop{right:calc(50% - 380px + 4vw)}}
/* feuilles */
#sheet{position:fixed;inset:0;z-index:30;background:rgba(6,20,30,.55);display:none;align-items:flex-end;justify-content:center}
#sheet.on{display:flex}
#sheet .in{background:var(--bg);width:min(620px,100%);max-height:94vh;overflow:auto;border-radius:26px 26px 0 0;padding:18px max(4vw,16px) 26px}
@media(min-width:700px){#sheet{align-items:center}#sheet .in{border-radius:26px}}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.sh h2{margin:0}
.amt{display:flex;align-items:center;gap:10px;margin-bottom:14px}.amt input{font-size:36px;font-weight:700;min-height:72px;border-radius:18px;text-align:center}.amt span{font-size:32px;font-weight:600;color:var(--mut)}
.lab{font-size:14px;color:var(--mut);margin:14px 0 6px;display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{display:flex;align-items:center;gap:8px;padding:0 14px;background:var(--card);border:1.5px solid var(--line)}.chip i{width:10px;height:10px;border-radius:50%;flex:none}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:flex;background:var(--soft);border-radius:999px;padding:4px;gap:2px}.seg button{flex:1;background:none;min-height:42px;padding:0 8px;white-space:nowrap}.seg button[aria-pressed=true]{background:var(--card);box-shadow:0 1px 4px rgba(15,42,61,.15);font-weight:600}
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.type{display:block;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:10px 12px;min-height:72px}
.type b{display:block;font-weight:600}.type span{font-size:13px;color:var(--mut);display:block;line-height:1.3}.type[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.chk{display:flex;align-items:center;gap:10px;margin-top:14px;min-height:44px;cursor:pointer}.chk input{width:22px;height:22px;min-height:0}
.go{width:100%;margin-top:20px;min-height:54px;font-size:17px}
.del{width:100%;margin-top:10px;background:none;color:var(--neg)}
.hmn{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:10px;flex-wrap:wrap}.hmn b{min-width:9.5em;text-align:center;text-transform:capitalize;font-weight:600}
.hmn button{background:rgba(255,255,255,.12);color:#fff;min-width:40px;min-height:38px;padding:0 12px}.hmn .today{font-size:14px}
.flows{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 16px;margin-top:10px;font-size:14px;color:#b9d3df}.flows b{color:#fff;font-weight:600}
.pill{display:inline-block;margin-top:10px;font-size:12px;padding:2px 10px;border-radius:99px;background:rgba(94,234,212,.18);color:#7ef0d6}
.tl{display:grid;grid-template-columns:repeat(var(--n,10),minmax(0,1fr));gap:4px;height:170px;margin-top:6px}
.tlc{display:flex;flex-direction:column;align-items:stretch;gap:4px;background:none;border-radius:12px;padding:6px 2px;min-height:0;height:100%}
.tlc.sel{background:var(--soft);box-shadow:inset 0 0 0 1.5px var(--ink)}.tlc:hover{filter:none;background:var(--soft)}
.tv{font-size:11px;text-align:center;font-weight:600}.tb{flex:1;display:flex;align-items:flex-end;justify-content:center}.tb i{display:block;width:70%;max-width:26px;border-radius:7px 7px 3px 3px;min-height:3px}
.tm{font-size:11px;color:var(--mut);text-align:center;text-transform:capitalize}
.row[disabled]{cursor:default;opacity:.85}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.bc{display:flex;flex-direction:column;align-items:stretch;text-align:left;background:var(--soft);border-radius:18px;padding:12px 14px;min-height:0;position:relative;overflow:hidden}
.bc:before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--c)}.bc:hover{filter:none;background:color-mix(in srgb,var(--soft) 80%,var(--c))}
.bn{display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.bn .dot{width:9px;height:9px}
.br{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-top:4px;line-height:1.1}
.sg{border-bottom:1px solid var(--line);padding:4px 0}.sg summary{display:flex;align-items:center;gap:10px;min-height:48px;cursor:pointer;list-style:none}.sg summary::-webkit-details-marker{display:none}
.sg .chev{color:var(--mut);transition:transform .2s}.sg[open] .chev{transform:rotate(90deg)}.sg>div:first-of-type{margin-top:4px}
.dl{font-size:12px;font-weight:600;margin-left:4px;white-space:nowrap;color:var(--mut)}.dl.up{color:var(--neg)}.dl.dn{color:var(--pos)}
.sv{display:flex;justify-content:space-between;gap:10px;margin-bottom:10px}.sv b{display:block;font-size:26px;font-weight:700;line-height:1.1}.sv span{display:block}
.sbars{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:3px;height:150px}
.sbc{display:flex;flex-direction:column;gap:4px;background:none;border-radius:10px;padding:4px 1px;min-height:0;height:100%}.sbc.sel{background:var(--soft);box-shadow:inset 0 0 0 1.5px var(--ink)}.sbc:hover{filter:none;background:var(--soft)}
.sb{flex:1;display:flex;flex-direction:column-reverse;align-items:center;justify-content:flex-start}.sb i{display:block;width:72%;max-width:22px;min-height:0}.sb i:last-child{border-radius:6px 6px 0 0}.sb i:first-child{border-radius:0 0 3px 3px}.sb i:only-child{border-radius:6px 6px 3px 3px}
.sdet{background:var(--soft);border-radius:16px;padding:10px 14px;margin-top:10px}.sdet .l{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:15px}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:6px 6px 6px 18px;border-radius:999px;display:none;align-items:center;gap:10px;z-index:40;white-space:nowrap}
#toast button{min-height:36px;background:var(--cor);color:#fff}
#note{text-align:center;font-size:12px;color:#9dbccb;margin-top:4px}
@media(prefers-reduced-motion:no-preference){.bar i,.minibar i{transition:width .4s ease}#sheet .in{animation:up .22s ease}@keyframes up{from{transform:translateY(30px);opacity:.4}}}
</style>
</head>
<body>
<div id="view"></div>
<div id="menu"><div class="pop" id="pop"></div></div>
<div id="sheet" role="dialog" aria-modal="true"><div class="in" id="sin"></div></div>
<div id="toast" role="status"><span id="tmsg"></span><button id="undo">Annuler</button></div>

<script>
{
const TYPES=[
 {id:'courant',n:'Compte courant',d:'Le quotidien : salaire, carte, prélèvements.'},
 {id:'joint',n:'Compte joint',d:'Compte courant partagé à deux.'},
 {id:'livreta',n:'Livret A',d:'Épargne dispo à tout moment, sans impôt.',p:22950,ep:1},
 {id:'ldds',n:'LDDS',d:'Comme le Livret A, sans impôt.',p:12000,ep:1},
 {id:'lep',n:'LEP',d:'Mieux payé, selon tes revenus.',p:10000,ep:1},
 {id:'jeune',n:'Livret Jeune',d:'Pour les 12–25 ans.',p:1600,ep:1},
 {id:'livret',n:'Livret bancaire',d:'Livret de ta banque.',ep:1},
 {id:'cel',n:'CEL',d:'Épargne logement disponible.',p:15300,ep:1},
 {id:'pel',n:'PEL',d:'Épargne logement, versements réguliers.',p:61200,ep:1},
 {id:'av',n:'Assurance-vie',d:'Épargne à long terme.',ep:1},
 {id:'pea',n:'PEA / bourse',d:'Placement en actions.',ep:1},
 {id:'especes',n:'Espèces',d:'L\'argent liquide sur toi.'}];
const TY=id=>TYPES.find(t=>t.id===id)||TYPES[0];
const DEF_GROUPS=[
 {id:'logement',n:'Logement',c:'#6c63ff',cats:[['loyer','Loyer (RIVP)',1],['edf','Électricité (EDF)',1],['assur','Assurance habitation',1]]},
 {id:'abos',n:'Abonnements',c:'#2ea7e0',cats:[['mobile','Forfait mobile (Free)',1],['box','Box internet (Free)',1],['canal','Canal+',1],['streaming','Streaming & applis',1],['gym','Salle de sport',1],['banque','Banque & cotisation',1]]},
 {id:'courses',n:'Courses',c:'#ff7a59',cats:[['courses','Courses',0]]},
 {id:'semaine',n:'Argent de la semaine',c:'#ffb627',cats:[['n26','N26',0],['retraits','Retraits & Revolut',0]]},
 {id:'transport',n:'Transport',c:'#14b8a6',cats:[['navigo','RATP / Navigo',1],['trajets','Autres trajets',0]]},
 {id:'famille',n:'Famille',c:'#ec4899',cats:[['elliott','Elliott',1],['nicolas','Nicolas',1],['cantine','Cantine',0]]},
 {id:'sante',n:'Santé',c:'#84cc16',cats:[['mutuelle','Mutuelle',1],['soins','Soins & pharmacie',0]]},
 {id:'impots',n:'Impôts',c:'#c08a3e',cats:[['impots','Impôts',0]]},
 {id:'loisirs',n:'Loisirs & sorties',c:'#a855f7',cats:[['sorties','Sorties & voyages',0],['cadeaux','Cadeaux & anniv',0]]},
 {id:'epargne',n:'Épargne',c:'#10b981',cats:[['vacances','Vacances',1],['ldd','LDD / Études',1]]},
 {id:'autre',n:'Autre',c:'#94a3b8',cats:[['divers','Divers',0]]}];
const CATDEF={};DEF_GROUPS.forEach(g=>g.cats.forEach(([id])=>CATDEF[id]=1));
let GROUPS=DEF_GROUPS,CAT={};
function ensure(){if(!Array.isArray(cfg.groups)||!cfg.groups.length)cfg.groups=JSON.parse(JSON.stringify(DEF_GROUPS));GROUPS=cfg.groups;CAT={};GROUPS.forEach(g=>g.cats.forEach(([id,n,f])=>CAT[id]={id,n,f:!!f,g:g.id,c:g.c}));SEUIL=cfg.seuil??150}
const REVC=[['salaire','Salaire'],['rembours','Remboursement'],['cadeau_r','Cadeau reçu'],['autre_r','Autre rentrée']];
const revN=id=>(REVC.find(r=>r[0]===id)||[0,'Rentrée'])[1];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur=(n,d=2)=>(Number(n)||0).toLocaleString('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:d,minimumFractionDigits:d});
const e0=n=>eur(n,0);const nid=()=>Math.random().toString(36).slice(2,10);const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addD=(s,n)=>{const[y,m,d]=s.split('-').map(Number);return iso(new Date(y,m-1,d+n))};
const today=iso(new Date()),curM=today.slice(0,7);
const mDays=k=>{const[y,m]=k.split('-').map(Number);return new Date(y,m,0).getDate()};
const shiftM=(k,d)=>{const[y,m]=k.split('-').map(Number);return iso(new Date(y,m-1+d,1)).slice(0,7)};
const mName=k=>{const[y,m]=k.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'})};
const dShort=s=>new Date(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8)).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});
const wS=addD(today,-((new Date().getDay()+6)%7)),wE=addD(wS,6),mEnd=curM+'-'+pad(mDays(curM));
const parseA=v=>Math.round(parseFloat(String(v).replace(/\s/g,'').replace(',','.'))*100)/100;

let cfg=null,months={},db=null,uid=null,local=false,dirty=new Set(),busy=0,tt,ready=false;
let tab='dep',vm=curM,openG=new Set(),focusG=null,showAll=false,lastDel=null;
const defCfg=()=>({accounts:[{id:'principal',name:'Compte principal',type:'courant',init:0,since:today},{id:'epargne',name:'Livret A',type:'livreta',init:0,since:today}],budgets:[],recur:[]});
const M=k=>months[k]||(months[k]={tx:[],skip:[]});
const acc=id=>cfg.accounts.find(a=>a.id===id);
function eachTx(cb){for(const k in months)for(const t of months[k].tx)cb(t,k)}
const eff=(t,id)=>{const a=+t.a||0;if(t.k==='dep')return t.acc===id?-a:0;if(t.k==='rev')return t.acc===id?a:0;if(t.k==='vir')return(t.acc===id?-a:0)+(t.to===id?a:0);return 0};
function balance(a){let b=+a.init||0;eachTx(t=>{if(t.d>=a.since&&t.d<=today)b+=eff(t,a.id)});return b}
const monthAmt=(b,k=curM)=>{const n=mDays(k),fk=b.from?b.from.slice(0,7):'',tk=b.to?b.to.slice(0,7):'';if(fk&&fk>k)return 0;if(tk&&tk<k)return 0;
  const d1=fk===k?+b.from.slice(8):1,d2=tk===k?+b.to.slice(8):n,days=Math.max(0,d2-d1+1);return b.per==='j'?b.a*days:b.per==='s'?b.a*days/7:(days?+b.a:0)};
function catSpent(id,cat,from,to){let s=0;eachTx(t=>{if(t.k==='dep'&&t.acc===id&&t.c===cat&&t.d>=from&&t.d<=to)s+= +t.a});return s}
function proj(a){let fut=0;eachTx(t=>{if(t.d>today&&t.d<=mEnd&&t.d>=a.since)fut+=eff(t,a.id)});
  let bud=0;cfg.budgets.filter(b=>b.acc===a.id).forEach(b=>{bud+=Math.max(0,monthAmt(b)-catSpent(a.id,b.cat,curM+'-01',mEnd))});
  const bal=balance(a);return{bal,fut,bud,fin:bal+fut-bud}}

// ---------- icônes ----------
function icon(t){const ty=TY(t),c=ty.ep?'#10b981':t==='especes'?'#ffb627':'#6c63ff';let p;
  if(t==='courant'||t==='joint')p='<rect x="3" y="6" width="18" height="12" rx="2.5"/><path d="M3 10h18"/>';
  else if(t==='especes')p='<rect x="3" y="7" width="18" height="10" rx="2"/><circle cx="12" cy="12" r="2.4"/>';
  else if(t==='cel'||t==='pel')p='<path d="M4 11l8-6 8 6v8H4z"/><path d="M10 19v-5h4v5"/>';
  else if(t==='av'||t==='pea')p='<path d="M4 18l5-6 4 3 7-8"/><path d="M15 7h5v5"/>';
  else p='<ellipse cx="12" cy="7" rx="7" ry="2.6"/><path d="M5 7v5c0 1.4 3.1 2.6 7 2.6s7-1.2 7-2.6V7M5 12v5c0 1.4 3.1 2.6 7 2.6s7-1.2 7-2.6v-5"/>';
  return`<span class="ic" style="background:linear-gradient(135deg,${c}2e,${c}12);color:${c}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${p}</svg></span>`}

// ---------- projection dans le temps ----------
function recOcc(k){if(k<=curM)return[];const mo=months[k]||{tx:[],skip:[]};
  return cfg.recur.filter(r=>(r.start||'')<=k&&(!r.end||r.end>=k+'-'+pad(Math.min(r.day||1,mDays(k))))&&!mo.skip.includes(r.id)&&!mo.tx.some(t=>t.r===r.id)&&acc(r.acc)&&(!r.to||acc(r.to)))
   .map(r=>({id:'v-'+r.id+'-'+k,virtual:1,acc:r.acc,to:r.to,k:r.k,a:+r.a,c:r.c,l:r.l||'',d:k+'-'+pad(Math.min(r.day||1,mDays(k))),r:r.id}))}
const txOfMonth=k=>(months[k]?.tx||[]).concat(recOcc(k));
let memo=new Map();
function flow(a,k){const key=a.id+'|f|'+k;if(memo.has(key))return memo.get(key);
  let rin=0,dout=0,vin=0,vout=0,bud=0;const by={};
  txOfMonth(k).forEach(t=>{if(t.d<a.since)return;const v=+t.a||0;
    if(t.k==='rev'&&t.acc===a.id)rin+=v;else if(t.k==='dep'&&t.acc===a.id){dout+=v;by[t.c]=(by[t.c]||0)+v}else if(t.k==='vir'){if(t.acc===a.id)vout+=v;if(t.to===a.id)vin+=v}});
  if(k>=curM)cfg.budgets.filter(b=>b.acc===a.id).forEach(b=>{const sp=k===curM?catSpent(a.id,b.cat,curM+'-01',mEnd):(by[b.cat]||0);bud+=Math.max(0,monthAmt(b,k)-sp)});
  const r={rin,dout,vin,vout,bud,by};memo.set(key,r);return r}
function endBal(a,k){const key=a.id+'|e|'+k;if(memo.has(key))return memo.get(key);let v;
  if(k<curM){const end=k+'-'+pad(mDays(k));v=+a.init||0;eachTx(t=>{if(t.d>=a.since&&t.d<=end)v+=eff(t,a.id)})}
  else if(k===curM)v=proj(a).fin;
  else{const f=flow(a,k);v=endBal(a,shiftM(k,-1))+f.rin+f.vin-f.dout-f.vout-f.bud}
  memo.set(key,v);return v}
const kfmt=v=>Math.abs(v)>=1000?(v/1000).toLocaleString('fr-FR',{maximumFractionDigits:1})+' k':Math.round(v)+'';

// ---------- catégorie devinée ----------
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const DICT=[[/\b(lidl|carrefour|monoprix|franprix|auchan|leclerc|intermarche|super ?u|casino|picard|aldi|leader price|g20|naturalia|biocoop|courses|marche|boucherie|primeur|epicerie|boulang\w*|patisserie)\b/,'courses'],
 [/\b(pharma\w*|medecin|docteur|dr|dentiste|kine|ophtalmo|generaliste|laboratoire|labo|analyses|hopital|osteo\w*|psy\w*)\b/,'soins'],
 [/\b(navigo|ratp|metro)\b/,'navigo'],[/\b(sncf|train|tgv|ouigo|uber|taxi|bolt|g7|heetch|velib|lime|essence|carburant|peage|parking|blablacar)\b/,'trajets'],
 [/\b(netflix|spotify|deezer|disney|prime video|amazon prime|youtube|apple|icloud|playstation|xbox|abonnement)\b/,'streaming'],[/\b(canal)\b/,'canal'],
 [/\b(resto\w*|mcdo\w*|burger|kfc|sushi|pizza\w*|kebab|tacos|cafe|bar|brasserie|cinema|cine|concert|theatre|musee|bowling|sortie|soiree|voyage|hotel|airbnb|vacances)\b/,'sorties'],
 [/\b(cadeau\w*|anniv\w*|noel|fleurs)\b/,'cadeaux'],[/\b(loyer|rivp|bailleur)\b/,'loyer'],[/\b(edf|engie|electricite|gaz|total energies)\b/,'edf'],
 [/\b(assurance habitation|maif|macif|matmut)\b/,'assur'],[/\b(mutuelle)\b/,'mutuelle'],[/\b(impot\w*|taxe)\b/,'impots'],[/\b(cantine)\b/,'cantine'],
 [/\b(retrait|dab|revolut|liquide)\b/,'retraits'],[/\b(n26)\b/,'n26'],[/\b(salle|gym|basic fit|fitness|neoness|keepcool)\b/,'gym'],[/\b(free|sfr|orange|bouygues|forfait)\b/,'mobile']];
function guessCat(text){const t=norm(text);if(t.length<2)return null;const w=t.split(' ')[0];const cnt={};
  eachTx(x=>{if(x.k!=='dep'||!x.l||!x.c||!CAT[x.c])return;const n=norm(x.l);if(n===t||n.split(' ')[0]===w)cnt[x.c]=(cnt[x.c]||0)+1});
  const best=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];if(best)return best[0];
  for(const[re,c]of DICT)if(re.test(t)&&CAT[c])return c;return null}

// ---------- vues ----------
function route(){if(!cfg)return;ensure();memo=new Map();const h=location.hash.slice(1);if(h==='parametres'){renderSettings();return}const id=h.startsWith('compte-')?h.slice(7):null;
  if(id&&acc(id))renderAcc(acc(id));else renderHome();}
function renderHome(){let tot=0;const cards=cfg.accounts.map(a=>{const p=proj(a),ty=TY(a.type);tot+=p.bal;
    const plaf=ty.p?`<div class="minibar"><i style="width:${Math.min(100,Math.max(0,p.bal)/ty.p*100)}%"></i></div><div class="mut">${eur(p.bal,0)} sur ${e0(ty.p)} (plafond)</div>`:'';

   <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h2 style="margin:0">Catégories</h2><button id="gadd" style="min-height:38px;font-size:14px">+ Nouvelle famille</button></div>

  v0().querySelectorAll('[data-sg]').forEach(d=>d.ontoggle=()=>{d.open?sOpen.add(d.dataset.sg):sOpen.delete(d.dataset.sg)});

    cfg.groups.forEach(g=>g.cats=g.cats.filter(c=>c[0]!==id));cfg.groups=cfg.groups.filter(g=>g.cats.length);ensure();mark('cfg');renderSettings()});
  v.querySelectorAll('[data-ca]').forEach(b=>b.onclick=()=>{sOpen.add(b.dataset.ca);G(b.dataset.ca).cats.push(['c'+nid(),'Nouvelle catégorie',0]);ensure();mark('cfg');renderSettings();const ins=v.querySelectorAll(`[data-cn]`);});
  $('gadd').onclick=()=>{const pal=['#6c63ff','#2ea7e0','#ff7a59','#ffb627','#14b8a6','#ec4899','#84cc16','#a855f7','#10b981','#f43f5e'];const gid='g'+nid();sOpen.add(gid);cfg.groups.push({id:gid,n:'Nouvelle famille',c:pal[cfg.groups.length%pal.length],cats:[['c'+nid(),'Nouvelle catégorie',0]]});ensure();mark('cfg');renderSettings();window.scrollTo(0,document.body.scrollHeight)};

    const fresh=JSON.parse(JSON.stringify(DEF_GROUPS));used.forEach(([g,c])=>{let fg=fresh.find(x=>x.id==='autre');fg.cats.push(c)});cfg.groups=fresh;ensure();mark('cfg');renderSettings();toast('Catégories par défaut remises')};

function backupData(){return JSON.stringify({app:'mes-comptes',version:1,date:today,cfg,months},null,1)}
async function downloadBackup(){let dl=null;try{dl=await claude.use('downloads')}catch(_){}
  if(!dl){try{await navigator.clipboard.writeText(backupData());bkMsg='Téléchargement indisponible ici : la sauvegarde a été copiée, colle-la dans un fichier.'}catch(_){bkMsg='Téléchargement indisponible dans cette vue.'}renderSettings();return}
  try{await dl.save({filename:`flouze-sauvegarde-${today}.json`,data:new Blob([backupData()],{type:'application/json'})});cfg.lastBackup=today;mark('cfg');bkMsg='Fichier enregistré.'}catch(_){bkMsg='Téléchargement annulé.'}
  if(location.hash==='#parametres')renderSettings();else route()}
async function driveBackup(){const show=m=>{bkMsg=m;if(location.hash==='#parametres')renderSettings();else{route();toast(m)}};
  let mcp=null;try{mcp=await claude.use('mcp')}catch(_){}if(!mcp)return show('Google Drive n\'est pas accessible depuis cette vue. Utilise « Télécharger le fichier ».');
  bkMsg='Envoi vers Google Drive…';if(location.hash==='#parametres')renderSettings();
  try{await mcp.callTool('Google Drive','create_file',{title:`Flouze – sauvegarde ${today}.json`,textContent:backupData(),contentMimeType:'application/json',disableConversionToGoogleType:true});
    cfg.lastBackup=today;mark('cfg');show('Sauvegarde enregistrée dans ton Google Drive.')}
  catch(e){const c=e&&e.code;show(c==='server_not_connected'?'Google Drive n\'est pas connecté : ajoute-le dans claude.ai, Paramètres → Connecteurs.':c==='needs_reauth'?'Reconnecte Google Drive dans claude.ai, Paramètres → Connecteurs.':c==='approval_required'||c==='not_in_manifest'?'Il faut autoriser l\'appli à utiliser Google Drive (une fenêtre te le demande sur claude.ai).':c==='server_unavailable'||c==='upstream_error'?'Google Drive n\'a pas répondu. Vérifie dans ton Drive avant de réessayer.':'Sauvegarde impossible : '+(e&&e.message||'erreur'))}}
function backupBanner(){let any=false;eachTx(()=>{any=true});if(!any||(cfg.lastBackup||'').slice(0,7)>=curM)return'';
  return`<div class="card" style="border:2px solid #14b8a6"><h2>Sauvegarde de ${esc(mName(curM).split(' ')[0])}</h2><p class="mut" style="margin-top:-4px">Garde une copie de tes comptes au cas où.</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button class="pri" id="hbd">Google Drive</button><button id="hbf">Télécharger</button></div></div>`}

// ---------- conseils fin de mois ----------
let SEUIL=150;
function avg3(id,cat,grp){let s=0,n=0;for(let i=1;i<=3;i++){const k=shiftM(curM,-i);const mo=months[k];if(!mo||!mo.tx.some(t=>t.acc===id))continue;n++;
  mo.tx.forEach(t=>{if(t.k==='dep'&&t.acc===id&&(cat?t.c===cat:CAT[t.c]?.g===grp))s+= +t.a})}return n?s/n:null}
function active(a){let n=false;eachTx(t=>{if(!n&&(t.acc===a.id||t.to===a.id)&&t.d.slice(0,7)===curM)n=true});return n||+a.init!==0}
function advice(a,p){if(TY(a.type).ep||p.fin>=SEUIL||!active(a))return null;const tips=[],need=Math.ceil(SEUIL-p.fin);
  cfg.budgets.filter(b=>b.acc===a.id).forEach(b=>{const sp=catSpent(a.id,b.cat,curM+'-01',mEnd),mA=monthAmt(b);if(sp>mA)tips.push(`<b>${esc(CAT[b.cat]?.n)}</b> : déjà ${eur(sp-mA)} au-dessus du budget du mois.`);else if(b.per!=='m'){const[f,t2]=b.per==='j'?[today,today]:[wS,wE],ws=catSpent(a.id,b.cat,f,t2);if(ws>b.a)tips.push(`<b>${esc(CAT[b.cat]?.n)}</b> : ${eur(ws,0)} ${b.per==='j'?'aujourd\'hui':'cette semaine'} pour un budget de ${e0(b.a)}. Essaie de compenser ${b.per==='j'?'demain':'la semaine prochaine'}.`)}});
  const byG={};(months[curM]?.tx||[]).forEach(t=>{if(t.k==='dep'&&t.acc===a.id&&t.d<=today){const g=CAT[t.c]?.g||'autre';byG[g]=(byG[g]||0)+ +t.a}});
  GROUPS.forEach(g=>{if(!byG[g.id]||g.cats.every(c=>c[2]))return;const av=avg3(a.id,null,g.id);if(av&&byG[g.id]>av*1.15&&byG[g.id]-av>15)tips.push(`<b>${esc(g.n)}</b> : ${eur(byG[g.id],0)} ce mois contre ${eur(av,0)} d'habitude.`)});
  if(p.bud>0){const big=cfg.budgets.filter(b=>b.acc===a.id).map(b=>({b,r:Math.max(0,monthAmt(b)-catSpent(a.id,b.cat,curM+'-01',mEnd))})).sort((x,y)=>y.r-x.r)[0];
    if(big&&big.r>0)tips.push(`Il reste ${eur(big.r,0)} prévus pour <b>${esc(CAT[big.b.cat]?.n)}</b> : dépenser 20 % de moins te fait gagner ${eur(big.r*.2,0)}.`)}
  const varG=['loisirs','semaine','courses'].filter(g=>byG[g]).sort((x,y)=>byG[y]-byG[x])[0];
  if(varG&&!tips.some(t=>t.includes(GROUPS.find(g=>g.id===varG).n)))tips.push(`Ton plus gros poste variable ce mois-ci : <b>${esc(GROUPS.find(g=>g.id===varG).n)}</b> (${eur(byG[varG],0)}). C'est là que tu peux le plus facilement freiner.`);
  let abo=0;cfg.recur.forEach(r=>{if(r.acc===a.id&&r.k==='dep'&&CAT[r.c]?.g==='abos')abo+= +r.a});if(abo>0)tips.push(`Tes abonnements te coûtent ${eur(abo)} par mois : vérifie ceux que tu utilises peu.`);
  const left=mDays(curM)-+today.slice(8)+1;if(p.fin-p.bud>-Infinity&&left>1&&p.fin+p.bud>0)tips.push(`Pour finir le mois à 0 €, limite-toi à environ ${eur(Math.max(0,(p.fin+p.bud))/left)} par jour, toutes dépenses comprises.`);
  const src=cfg.accounts.filter(o=>o.id!==a.id&&balance(o)>=need).sort((x,y)=>balance(y)-balance(x))[0];
  return{need,tips:tips.slice(0,5),src}}
function adviceCard(a,p){const ad=advice(a,p);if(!ad)return'';
  return`<div class="card" style="border:2px solid var(--cor)"><h2>${p.fin<0?'Attention : fin de mois dans le rouge':'Fin de mois serrée'}</h2>
   <p style="margin:0 0 8px">Il te manquera environ <b>${eur(ad.need,0)}</b> pour finir le mois avec ${e0(SEUIL)} de marge.</p>
   ${ad.tips.length?`<ul style="margin:0;padding-left:20px;display:grid;gap:6px">${ad.tips.map(t=>`<li>${t}</li>`).join('')}</ul>`:'<p class="mut">Ajoute tes dépenses et tes budgets pour recevoir des conseils plus précis.</p>'}
   ${ad.src?`<button class="pri" id="cover" data-from="${esc(ad.src.id)}" data-a="${ad.need}" style="width:100%;margin-top:14px">Transférer ${eur(ad.need,0)} depuis ${esc(ad.src.name)}</button>`:''}</div>`}

function sheetBud(a,b){const st=b?{c:b.cat,g:CAT[b.cat]?.g,a:b.a,per:b.per,from:b.from||'',to:b.to||''}:{c:null,g:null,a:'',per:'s',from:today,to:''};const nextM=shiftM(curM,1)+'-01';
  const draw=()=>{const tm=st.from&&st.from.slice(0,7)>curM?st.from.slice(0,7):curM;const mA=parseA(st.a)>0?monthAmt({a:parseA(st.a),per:st.per,from:st.from,to:st.to},tm):0;
    $('sin').innerHTML=`${shHead(b?'Modifier le budget':'Nouveau budget')}
     <span class="lab" style="margin-top:0">Pour quoi ?</span><div class="chips">${GROUPS.map(g=>`<button type="button" class="chip" data-gr="${g.id}" aria-pressed="${st.g===g.id}"><i style="background:${g.c}"></i>${esc(g.n)}</button>`).join('')}</div>
     ${st.g?`<span class="lab">Précise</span><div class="chips">${GROUPS.find(g=>g.id===st.g).cats.map(([id,n])=>`<button type="button" class="chip" data-c="${id}" aria-pressed="${st.c===id}">${esc(n)}</button>`).join('')}</div>`:''}
     <span class="lab">Montant</span><div class="amt"><input id="sa" inputmode="decimal" placeholder="150" value="${esc(st.a)}" aria-label="Montant du budget"><span>€</span></div>
     <div class="seg"><button type="button" data-p="j" aria-pressed="${st.per==='j'}">par jour</button><button type="button" data-p="s" aria-pressed="${st.per==='s'}">par semaine</button><button type="button" data-p="m" aria-pressed="${st.per==='m'}">par mois</button></div>
     <p class="mut" id="tot" style="text-align:center;margin:12px 0 0">${mA?`Soit environ <b>${e0(mA)}</b> pour ${esc(mName(tm))}`:'&nbsp;'}</p>
     <span class="lab">Commence le</span><div class="chips" style="margin-bottom:8px"><button type="button" class="chip" data-fr="${today}" aria-pressed="${st.from===today}">Aujourd'hui</button><button type="button" class="chip" data-fr="${nextM}" aria-pressed="${st.from===nextM}">Le 1er du mois prochain</button></div><input type="date" id="bf" value="${esc(st.from)}">
     <span class="lab">Se termine le (facultatif)</span><input type="date" id="bt" value="${esc(st.to)}">
     <button class="pri go" id="ok">${b?'Enregistrer':'Créer le budget'}</button>${b?'<button class="del" id="rm">Supprimer ce budget</button>':''}<p class="mut" id="err" style="text-align:center"></p>`;
    const s=$('sin');s.querySelector('[data-close]').onclick=closeSheet;
    $('sa').oninput=e=>{st.a=e.target.value;const v=parseA(st.a);$('tot').innerHTML=v>0?`Soit environ <b>${e0(monthAmt({a:v,per:st.per,from:st.from,to:st.to},tm))}</b> pour ${esc(mName(tm))}`:'&nbsp;'};
    s.querySelectorAll('[data-fr]').forEach(x=>x.onclick=()=>{st.from=x.dataset.fr;draw()});$('bf').onchange=e=>{st.from=e.target.value;draw()};$('bt').onchange=e=>{st.to=e.target.value;draw()};
    s.querySelectorAll('[data-gr]').forEach(x=>x.onclick=()=>{st.g=x.dataset.gr;const g=GROUPS.find(y=>y.id===st.g);st.c=g.cats.length===1?g.cats[0][0]:null;draw()});
    s.querySelectorAll('[data-c]').forEach(x=>x.onclick=()=>{st.c=x.dataset.c;draw()});
    s.querySelectorAll('[data-p]').forEach(x=>x.onclick=()=>{st.per=x.dataset.p;draw()});
    $('ok').onclick=()=>{const v=parseA(st.a);if(!st.c){$('err').textContent='Choisis une catégorie.';return}if(!(v>0)){$('err').textContent='Indique un montant.';return}
      if(st.to&&st.from&&st.to<st.from){$('err').textContent='La fin doit être après le début.';return}
      if(b)Object.assign(b,{cat:st.c,a:v,per:st.per,from:st.from||'',to:st.to||''});else cfg.budgets.push({id:nid(),acc:a.id,cat:st.c,a:v,per:st.per,from:st.from||today,to:st.to||''})
      mark('cfg');closeSheet();route();toast(b?'Budget modifié':'Budget créé')};
    if(b)$('rm').onclick=()=>{cfg.budgets=cfg.budgets.filter(x=>x!==b);mark('cfg');closeSheet();route()}};
  $('sheet').classList.add('on');draw()}

function sheetAcc(a){const st={type:a?a.type:'courant',name:a?a.name:'',confirm:false};
  const draw=()=>{const cur=a?balance(a):0;
    $('sin').innerHTML=`${shHead(a?'Modifier le compte':'Nouveau compte')}
     <span class="lab" style="margin-top:0">Type de compte</span><div class="types">${TYPES.map(t=>`<button type="button" class="type" data-ty="${t.id}" aria-pressed="${st.type===t.id}"><b>${esc(t.n)}</b><span>${esc(t.d)}${t.p?' Plafond '+e0(t.p)+'.':''}</span></button>`).join('')}</div>
     <span class="lab">Nom</span><input id="an" value="${esc(st.name)}" placeholder="${esc(TY(st.type).n)}">
     <span class="lab">Solde actuel</span><div class="amt"><input id="ab" inputmode="decimal" placeholder="0" value="${a?esc(String(Math.round(cur*100)/100)):''}" aria-label="Solde actuel"><span>€</span></div>
     <button class="pri go" id="ok">${a?'Enregistrer':'Créer le compte'}</button>
     ${a&&cfg.accounts.length>1?`<button class="del" id="rm">${st.confirm?'Confirmer : supprimer le compte et ses opérations':'Supprimer ce compte'}</button>`:''}`;
    const s=$('sin');s.querySelector('[data-close]').onclick=closeSheet;$('an').oninput=e=>st.name=e.target.value;
    s.querySelectorAll('[data-ty]').forEach(x=>x.onclick=()=>{st.type=x.dataset.ty;const ab=$('ab').value;draw();$('ab').value=ab});
    $('ok').onclick=()=>{const name=st.name.trim()||TY(st.type).n,v=parseA($('ab').value)||0;
      if(a){a.name=name;a.type=st.type;a.init=(+a.init||0)+(v-balance(a));mark('cfg');closeSheet();route();toast('Compte modifié')}
      else{const n={id:nid(),name,type:st.type,init:v,since:today};cfg.accounts.push(n);mark('cfg');closeSheet();location.hash='compte-'+n.id;route();toast('Compte créé')}};
    if($('rm'))$('rm').onclick=()=>{if(!st.confirm){st.confirm=true;draw();return}
      for(const k in months){const before=months[k].tx.length;months[k].tx=months[k].tx.filter(t=>t.acc!==a.id&&t.to!==a.id);if(months[k].tx.length!==before)mark(k)}
      cfg.accounts=cfg.accounts.filter(x=>x!==a);cfg.budgets=cfg.budgets.filter(b=>b.acc!==a.id);cfg.recur=cfg.recur.filter(r=>r.acc!==a.id&&r.to!==a.id);mark('cfg');closeSheet();location.hash='comptes';route()}};
  $('sheet').classList.add('on');draw();setTimeout(()=>$(a?'ab':'an')?.focus(),60)}

function delTx(id){const f=findTx(id);if(!f)return;M(f.k).tx.splice(f.i,1);if(f.t.r&&!M(f.k).skip.includes(f.t.r))M(f.k).skip.push(f.t.r);mark(f.k);lastDel={k:f.k,t:f.t};toast('Supprimé',null,true)}
function toast(msg,addId,isDel){$('tmsg').textContent=msg;const u=$('undo');u.style.display=addId||isDel?'':'none';
  u.onclick=()=>{if(addId){const f=findTx(addId);if(f){M(f.k).tx.splice(f.i,1);mark(f.k)}}else if(isDel&&lastDel){M(lastDel.k).tx.push(lastDel.t);const sk=M(lastDel.k).skip;if(lastDel.t.r)M(lastDel.k).skip=sk.filter(x=>x!==lastDel.t.r);mark(lastDel.k);lastDel=null}$('toast').style.display='none';route()};
  $('toast').style.display='flex';clearTimeout(window._tu);window._tu=setTimeout(()=>$('toast').style.display='none',5000)}

// ---------- opérations répétées ----------
function materialize(){const mo=M(curM);let ch=false;
  cfg.recur.forEach(r=>{if((r.start||curM)>curM||(r.end&&r.end<curM+'-'+pad(Math.min(r.day||1,mDays(curM))))||mo.skip.includes(r.id)||mo.tx.some(t=>t.r===r.id))return;if(!acc(r.acc))return;
    const t={id:nid(),acc:r.acc,k:r.k,a:r.a,c:r.c,l:r.l||'',d:curM+'-'+pad(Math.min(r.day||1,mDays(curM))),r:r.id};if(r.to)t.to=r.to;mo.tx.push(t);ch=true});
  if(ch)mark(curM)}

// ---------- enregistrement ----------
let noteTxt='Chargement…';function note(){const n=$('note');if(n)n.textContent=noteTxt}
function mark(key){dirty.add(key);clearTimeout(tt);tt=setTimeout(flush,400);if(local){try{localStorage.setItem('mes-comptes-v7',JSON.stringify({cfg,months}))}catch(e){}}}
async function flush(){if(local){dirty.clear();return}const keys=[...dirty];dirty.clear();busy++;
  try{for(const k of keys){const ref=db.collection('data/users/'+uid).doc(k==='cfg'?'cfg7':'z'+k);const body=JSON.parse(JSON.stringify(k==='cfg'?cfg:M(k)));
    try{await ref.set(body)}catch(e){if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,900));try{await ref.set(body)}catch(_){}}else{noteTxt='Enregistrement impossible pour le moment.';note()}}}}finally{busy--}}
function start(){ensure();if(!ready){ready=true;if(!cfg.groups)mark('cfg');materialize()}route()}
function useLocal(msg){local=true;try{const d=JSON.parse(localStorage.getItem('mes-comptes-v7')||'null');if(d){cfg=d.cfg;months=d.months||{}}}catch(e){}if(!cfg){cfg=defCfg();mark('cfg')}noteTxt=msg;start()}
async function boot(){try{db=await claude.use('db');const u=await claude.use('user');uid=u?await u.id():null}catch(e){db=null}
  if(!db||!uid)return useLocal('Enregistré dans ce navigateur');
  const timer=setTimeout(()=>{noteTxt='Connexion lente…';if(!cfg){cfg=defCfg();start()}else note()},10000);
  db.collection('data/users/'+uid).onSnapshot(snap=>{if(dirty.size||busy)return;let c=null;const ms={};
    snap.docs.forEach(d=>{if(!d.exists)return;const v=JSON.parse(JSON.stringify(d.data()));if(d.id==='cfg7')c=v;else if(/^z\d{4}-\d\d$/.test(d.id))ms[d.id.slice(1)]={tx:Array.isArray(v.tx)?v.tx:[],skip:Array.isArray(v.skip)?v.skip:[]}});
    if(snap.metadata.fromCache&&!c)return;
    clearTimeout(timer);if(!snap.metadata.fromCache)noteTxt='';
    if(!c){cfg=defCfg();mark('cfg');months=ms;start();return}
    ['accounts','budgets','recur'].forEach(k=>{if(!Array.isArray(c[k]))c[k]=[]});if(!c.accounts.length)c.accounts=defCfg().accounts;
    cfg=c;months=ms;if($('sheet').classList.contains('on'))return;start()},()=>{clearTimeout(timer);useLocal('Enregistré dans ce navigateur')})}
window.addEventListener('hashchange',()=>{tab='dep';vm=curM;openG.clear();focusG=null;showAll=false;route();window.scrollTo(0,0)});
$('view').innerHTML='<div class="head"><div class="center"><small>Chargement…</small></div></div>';
boot();
}
</script>
</body>
